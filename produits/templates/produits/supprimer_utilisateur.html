{% extends "produits/base.html" %}

{% block content %}

<div class="w-full">
    <h2 class="text-xl font-bold mb-4">Supprimer l'employé</h2>
    
    <p class="mb-4">Es-tu sûr de vouloir supprimer <strong>{{ utilisateur.username }}</strong> ?</p>

    <form method="post" class="space-y-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-error w-full">Oui, supprimer</button>
        <a href="{% url 'liste_utilisateurs' %}" class="btn btn-primary w-full">Annuler</a>
    </form>
</div>

{% endblock %}
