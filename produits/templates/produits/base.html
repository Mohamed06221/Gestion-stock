<!DOCTYPE html>
<html lang="en" data-theme="forest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <!-- Navbar -->
    <div class="navbar bg-base-300 px-6">
        <div class="flex-1">
            <a class="text-xl font-bold">🏪 Gestion Stock</a>
        </div>
        <div class="flex gap-4">
            <a href="{% url 'liste_produit' %}" class="btn btn-ghost">Produits</a>
            {% if request.user.is_staff %}
                <a href="{% url 'liste_categorie' %}" class="btn btn-ghost">Catégories</a>
            {% endif %}
            <a href="{% url 'liste_entrees' %}" class="btn btn-ghost">Entrées</a>
            <a href="{% url 'liste_sorti' %}" class="btn btn-ghost">Sorties</a>
            {% if request.user.is_superuser %}
                <a href="{% url 'liste_utilisateurs' %}" class="btn btn-ghost">Utilisateurs</a>
            {% endif %}
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
            <button type="submit" class="btn btn-error btn-sm">Déconnexion</button>
</form>

        </div>
    </div>

    <div class="flex justify-center mt-10">
        <div class="flex flex-col w-2/3 bg-base-200 rounded-xl p-6">
            <div class="w-full h-fit">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
    

</body>
</html>
