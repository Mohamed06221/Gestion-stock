{% extends "produits/base.html" %}

{% block content %}

<div class="w-full">
    <h2 class="text-xl font-bold mb-4">Ajouter un employé</h2>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div class="space-y-1">
            <label class="text-sm font-semibold">Nom d'utilisateur</label>
            <input type="text" name="username" class="input input-bordered w-full" placeholder="Nom d'utilisateur" required>
        </div>

        <div class="space-y-1">
            <label class="text-sm font-semibold">Mot de passe</label>
            <input type="password" name="password1" class="input input-bordered w-full" placeholder="Mot de passe" required>
        </div>

        <div class="space-y-1">
            <label class="text-sm font-semibold">Confirmer mot de passe</label>
            <input type="password" name="password2" class="input input-bordered w-full" placeholder="Confirmer mot de passe" required>
        </div>

        {% if form.errors %}
        <div class="alert alert-error">
            {% for field in form %}
                {% for error in field.errors %}
                    <p> {{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
        {% endif %}

        <button type="submit" class="btn btn-primary w-full">Enregistrer</button>
        <a href="{% url 'liste_utilisateurs' %}" class="btn btn-ghost w-full btn btn-error"">Annuler</a>
    </form>
</div>

{% endblock %}
