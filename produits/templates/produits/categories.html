{% extends "produits/base.html" %}


{% block content %}

<div class="w-full bg-base-200">

            <form method="GET" class="mb-4 flex gap-2">
                <input type="text" name="q" value="{{ recherche }}"
                    class="input input-bordered w-full"
                    placeholder="Rechercher...">
                <button type="submit" class="btn btn-primary">Rechercher</button>
                {% if recherche %}
                    <a href="." class="btn btn-ghost">Effacer</a>
                {% endif %}
            </form>

    <div class="mb-4">
        <a href="{% url 'ajouter_categorie' %}" class="btn btn-primary w-full">Ajouter une catégorie</a>
    </div>

    <div class="space-y-4 w-full">
        {% for categorie in categories %}
        <div class="categorie-item p-4 bg-base-100 rounded-lg w-full flex justify-between items-center">
            <div>
                <p class="font-bold text-lg nom-categorie">{{ categorie.nom }}</p>
            </div>

            <div class="space-x-2">
                <a href="{% url 'modifier_categorie' categorie.id %}" class="btn btn-primary btn-sm">Modifier</a>
                <a href="{% url 'supprimer_categorie' categorie.id %}" class="btn btn-error btn-soft btn-sm">Supprimer</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% include "produits/pagination.html" %} 




{% endblock %}
