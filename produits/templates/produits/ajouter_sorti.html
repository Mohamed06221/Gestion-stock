{% extends "produits/base.html" %}

{% block content %}

<div class="w-full">
    <h2 class="text-xl font-bold mb-4">Ajouter une sortie de stock</h2>
    
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">

            {% if form.errors %}
            <div class="alert alert-error">
                {% for field in form %}
                    {% for error in field.errors %}
                        <p> {{ error }}</p>
                    {% endfor %}
                {% endfor %}
            </div>
            {% endif %}

            {{ form.produit }}
            {{ form.quantite }}

            <button type="submit" class="btn btn-primary w-full">Enregistrer</button>
            <a href="{% url 'liste_sorti' %}" class="btn btn-error w-full">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
