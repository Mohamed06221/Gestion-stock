{% extends "produits/base.html" %}

{% block content %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{form.nom}}
        {{form.categorie}}
        {{form.prix}}
        {{form.quantite}}
        <button type="submit" class="btn btn-primary w-full">Enregistrer</button>
        <a href="{% url 'liste_produit' %}" class="btn btn-ghost w-full btn btn-error"">Annuler</a>
    </form>

{% endblock %}
