<!DOCTYPE html>
<html lang="en" data-theme="forest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="flex justify-center items-center h-screen">
        <div class="flex flex-col w-96 bg-base-200 rounded-xl p-8 space-y-6 shadow-xl">
            
            <div class="text-center">
                <h1 class="text-3xl font-bold">🏪 Gestion Stock</h1>
                <p class="text-sm opacity-60 mt-1">Connectez-vous pour continuer</p>
            </div>

            <form method="post" class="space-y-4">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="alert alert-error">
                        <p>Nom d'utilisateur ou mot de passe incorrect.</p>
                    </div>
                {% endif %}
                
                <div class="space-y-1">
                    <label class="text-sm font-semibold">Nom d'utilisateur</label>
                    <input type="text" name="username" class="input input-bordered w-full" placeholder="Entrez votre nom d'utilisateur" required>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-semibold">Mot de passe</label>
                    <input type="password" name="password" class="input input-bordered w-full" placeholder="Entrez votre mot de passe" required>
                </div>

                <button type="submit" class="btn btn-primary w-full mt-2">Se connecter</button>
            </form>
            <p class="text-center text-sm">Pas de compte ? 
                <a href="{% url 'register' %}" class="text-primary font-semibold">S'inscrire</a>
            </p>

        </div>
    </div>
</body>
</html>
